<!doctype html>
<!-- http://localhost/wrk/ai/dic2 -->
<html lang="de-DE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="Nachrichten diktieren, aufbereiten, kopieren, teilen und vorlesen.">
    <title>DictoPhone AI</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/app.css">
    <script type="module" src="assets/app.js" defer></script>
</head>
<body>
    <main class="container">
        <nav class="controls" aria-label="Textwerkzeuge">
            <button id="record-button" class="icon-button recording-off" type="button" title="Diktat aufnehmen" aria-label="Diktat aufnehmen">
                <span id="record-label" aria-hidden="true">&#x25CF;</span>
            </button>
            <button id="format-button" class="icon-button" type="button" title="Entwurf mit KI korrigieren und aufbereiten" aria-label="Entwurf korrigieren">Korrigieren</button>
            <button id="speak-button" class="icon-button" type="button" title="Entwurf vorlesen" aria-label="Entwurf vorlesen">&#x25B6;</button>
            <button id="share-button" class="icon-button" type="button" title="Nachricht teilen oder an WhatsApp senden" aria-label="Nachricht teilen (z.B. an WhatsApp senden)">Teilen</button>
            <button id="copy-button" class="icon-button" type="button" title="In die Zwischenablage kopieren" aria-label="In die Zwischenablage kopieren">&#x29C9;</button>
            <div class="btn-pair">
                <button id="undo-button" class="icon-button" type="button" title="Letzte Änderung rückgängig" aria-label="Letzte Änderung rückgängig">&#x21B6;</button>
                <button id="info-button" class="icon-button" type="button" title="Informationen zur App" aria-label="Informationen zur App">&#x24D8;</button>
                <button id="clear-button" class="icon-button" type="button" title="Entwurf löschen" aria-label="Entwurf löschen">&#x00D7;</button>
            </div>
        </nav>

        <textarea id="draft" inputmode="none" placeholder="Warte auf Eingabe …" spellcheck="true" aria-label="Nachrichtenentwurf"></textarea>
        <output id="status" class="toast" aria-live="polite" aria-atomic="true"></output>
    </main>

    <dialog id="message-dialog" class="message-dialog" aria-labelledby="message-title">
        <h3 id="message-title">Hinweis</h3>
        <p id="message-text"></p>
        <button id="message-close" type="button">OK</button>
    </dialog>

    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title">
        <h3 id="confirm-title">Text löschen?</h3>
        <p>Soll der gesamte Text wirklich gelöscht werden?</p>
        <div class="confirm-actions">
            <button id="confirm-cancel" type="button">Abbrechen</button>
            <button id="confirm-clear" class="icon-button" type="button" title="Entwurf löschen" aria-label="Entwurf löschen">Löschen</button>
        </div>
    </dialog>

    <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-title" aria-describedby="capture-status">
        <div class="record-top"><span>Mikrofon</span><span id="capture-badge" class="capture-badge">STARTET</span></div>
        <h2 id="record-title">Sprechen zum Starten</h2>
        <div id="capture-time" class="capture-clock" aria-label="Aufnahmedauer">00:00.0</div>
        <p id="capture-status" role="status" aria-live="polite">Mikrofon freigeben …</p>
        <label class="threshold-label" for="threshold">Sprachschwelle <output id="threshold-value">0,052 RMS</output></label>
        <input id="threshold" type="range" min="0.005" max="0.15" step="0.001" value="0.052">
        <div class="record-actions">
            <button id="record-cancel" type="button" autofocus>Abbruch</button>
            <div class="meter-area">
                <div class="meter-label"><span>Mikrofonpegel</span><span id="level-value">−∞ dBFS</span></div>
                <div id="level-meter" class="level-meter" role="meter" aria-label="Mikrofonpegel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="level-fill"></div><span id="threshold-marker"></span>
                </div>
            </div>
            <button id="record-accept" type="button" disabled>OK</button>
        </div>
    </dialog>

    <audio id="player"></audio>
</body>
</html>
