<!doctype html>
<html lang="de-DE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="Nachrichten diktieren, aufbereiten, kopieren, teilen und vorlesen.">
    <title>DictoPhone AI</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/app.css">
    <script type="module" src="assets/app.js" defer></script>
</head>
<body>
    <main class="container">
        <nav class="controls" aria-label="Textwerkzeuge">
            <button id="record-button" class="recording-off" type="button" title="Diktat aufnehmen">
                <span id="record-label">Aufnehmen</span>
            </button>
            <button id="format-button" type="button" title="Entwurf mit KI korrigieren und aufbereiten">Korrigieren</button>
            <button id="speak-button" type="button" title="Entwurf vorlesen">Vorlesen</button>
            <button id="share-button" type="button" title="Nachricht teilen oder an WhatsApp senden">An WhatsApp</button>
            <button id="copy-button" type="button" title="In die Zwischenablage kopieren">Kopieren</button>
            <div class="btn-pair">
                <button id="undo-button" type="button" title="Letzte Änderung rückgängig">Zurück</button>
                <button id="info-button" type="button" title="Informationen zur App" aria-label="Informationen zur App">(&#x2139;)</button>
                <button id="clear-button" type="button" title="Entwurf löschen" aria-label="Entwurf löschen">&#x2715;</button>
            </div>
        </nav>

        <textarea id="draft" inputmode="none" placeholder="Warte auf Eingabe …" spellcheck="true" aria-label="Nachrichtenentwurf"></textarea>
        <output id="status" class="toast" aria-live="polite" aria-atomic="true"></output>
    </main>

    <dialog id="message-dialog" class="message-dialog" aria-labelledby="message-title">
        <h3 id="message-title">Hinweis</h3>
        <p id="message-text"></p>
        <button id="message-close" type="button">OK</button>
    </dialog>

    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title">
        <h3 id="confirm-title">Text löschen?</h3>
        <p>Soll der gesamte Text wirklich gelöscht werden?</p>
        <div class="confirm-actions">
            <button id="confirm-cancel" type="button">Abbrechen</button>
            <button id="confirm-clear" type="button">Löschen</button>
        </div>
    </dialog>

    <audio id="player"></audio>
</body>
</html>
